<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escáner de códigos</title>
<style>
:root{--bg:#f5f6f8;--fg:#1d2330;--card:#fff;--accent:#2563eb;--muted:#6b7280;--ok:#16a34a;--err:#dc2626;--border:#d6dae1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1218;--fg:#e8ebf1;--card:#171c26;--accent:#5b8cff;--muted:#9aa3b2;--border:#2a3142}}
:root[data-theme="dark"]{--bg:#0f1218;--fg:#e8ebf1;--card:#171c26;--accent:#5b8cff;--muted:#9aa3b2;--border:#2a3142}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto;padding-bottom:40px}
h1{font-size:1.35rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;font-size:1.05rem;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:72px;resize:vertical}
button,.btnfile{display:block;font-size:1.05rem;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;width:100%;margin-top:10px;font-weight:600;cursor:pointer;text-align:center}
button.sec,.btnfile.sec{background:transparent;color:var(--accent);border:1px solid var(--border)}
button:disabled{opacity:.5}
input[type=file]{display:none}
.seg{display:flex;gap:8px;margin-top:4px}
.seg button{margin-top:0;background:var(--bg);color:var(--fg);border:1px solid var(--border)}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg{margin-top:10px;font-size:.95rem;min-height:1.3em;line-height:1.3}
.ok{color:var(--ok)} .err{color:var(--err)}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px;line-height:1.35}
</style>
</head>
<body>
<h1>Escáner de códigos</h1>

<div class="card">
  <video id="video" playsinline muted autoplay></video>
  <button id="btnCam">Iniciar cámara</button>
  <label class="btnfile sec" for="foto">Leer desde una foto</label>
  <input id="foto" type="file" accept="image/*" capture="environment">
  <div class="hint">Lee EAN-13 y Code 128. Con la cámara: código completo dentro del cuadro, a 10–15 cm, con buena luz y sin reflejos. Si no lee en vivo, toma una foto del código.</div>
  <div class="msg" id="estado" role="status"></div>
</div>

<div class="card">
  <label>Código leído</label>
  <input id="codigo" inputmode="numeric" autocomplete="off" placeholder="Escanea o escribe el código">
  <input id="formato" type="hidden">

  <label>Tipo</label>
  <div class="seg" id="tipo">
    <button type="button" data-tipo="Bodega" class="on" aria-pressed="true">Bodega</button>
    <button type="button" data-tipo="Medidor" aria-pressed="false">Medidor</button>
  </div>

  <label id="lblCant" for="cantidad">Cantidad</label>
  <input id="cantidad" type="number" inputmode="decimal" step="any" min="0" placeholder="0">

  <label for="usuario">Usuario</label>
  <input id="usuario" autocomplete="name" placeholder="Tu nombre">

  <label for="notas">Notas</label>
  <textarea id="notas" placeholder="Opcional"></textarea>

  <button id="btnGuardar">Guardar</button>
  <div class="msg" id="msg" role="status"></div>
</div>

<div class="card">
  <button id="btnToken" class="sec">Cambiar token</button>
  <div class="hint">El token se pide la primera vez y se guarda solo en este teléfono.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// URL del Apps Script (Web App /exec). El token NO va aquí: se pide en el teléfono.
const APP_URL = 'https://script.google.com/macros/s/AKfycbzn3Zw4s5kdHHPwI6jraVrsPGGioGOgYkxS6EWDTyKnB1m5nLfGxG2TjLjB-QoUM1ASaw/exec';
const HOJA = 'Escaneos';
const TOKEN_KEY = 'escaner_token';
const USUARIO_KEY = 'escaner_usuario';

const $ = (id) => document.getElementById(id);
const video = $('video'), btnCam = $('btnCam'), codigoIn = $('codigo'), formatoIn = $('formato');
const cantIn = $('cantidad'), lblCant = $('lblCant'), usuarioIn = $('usuario'), notasIn = $('notas');
const btnGuardar = $('btnGuardar'), msg = $('msg'), estado = $('estado'), fotoIn = $('foto');
let tipo = 'Bodega', camActiva = false, parar = null, lastCode = '', lastTime = 0;

function mostrar(texto, clase) { msg.textContent = texto; msg.className = 'msg ' + (clase || ''); }
function estadoCam(texto, clase) { estado.textContent = texto; estado.className = 'msg ' + (clase || ''); }

// Storage: siempre dentro de try/catch (modo privado o datos bloqueados).
function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function escribir(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function borrar(k) { try { localStorage.removeItem(k); } catch (e) {} }

function getToken() {
  let t = leer(TOKEN_KEY);
  if (!t) {
    t = (window.prompt('Escribe el token de seguridad:') || '').trim();
    if (t) escribir(TOKEN_KEY, t);
  }
  return t;
}

usuarioIn.value = leer(USUARIO_KEY);

// Tipo: Bodega = cantidad, Medidor = lectura
document.querySelectorAll('#tipo button').forEach((b) => {
  b.addEventListener('click', () => {
    tipo = b.dataset.tipo;
    document.querySelectorAll('#tipo button').forEach((x) => {
      const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on);
    });
    lblCant.textContent = tipo === 'Medidor' ? 'Lectura' : 'Cantidad';
  });
});

// Formatos permitidos: EAN-13 y Code 128
function formatoNombre(f) {
  const s = String(f).toLowerCase();
  if (s.indexOf('ean_13') >= 0 || s === 'ean13' || (typeof ZXing !== 'undefined' && f === ZXing.BarcodeFormat.EAN_13)) return 'EAN-13';
  return 'Code 128';
}

function crearLector() {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return new ZXing.BrowserMultiFormatReader(hints, 300);
}

// Cámara en vivo. Usa BarcodeDetector del navegador si existe (Android Chrome); si no, ZXing.
async function iniciarCamara() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    estadoCam('Este navegador no permite usar la cámara. Usa "Leer desde una foto".', 'err'); return;
  }
  estadoCam('Abriendo cámara…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 }, height: { ideal: 720 },
        advanced: [{ focusMode: 'continuous' }]
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    camActiva = true;
    btnCam.textContent = 'Detener cámara';
    estadoCam('Cámara activa. Apunta al código de barras y espera…');

    if ('BarcodeDetector' in window) {
      parar = iniciarDetector();
    } else {
      if (typeof ZXing === 'undefined') { estadoCam('No cargó el lector de códigos. Revisa tu conexión.', 'err'); return; }
      const lector = crearLector();
      const c = await lector.decodeFromVideoElement(video, (result) => { if (result) onLectura(result.getText(), formatoNombre(result.getBarcodeFormat())); });
      parar = () => { try { c.stop(); } catch (e) {} };
    }
  } catch (e) {
    camActiva = false;
    estadoCam('No se pudo abrir la cámara (' + (e.name || 'error') + '). Revisa el permiso del navegador o usa "Leer desde una foto".', 'err');
  }
}

function iniciarDetector() {
  const det = new BarcodeDetector({ formats: ['ean_13', 'code_128'] });
  let activo = true;
  const tick = async () => {
    if (!activo) return;
    try {
      const codes = await det.detect(video);
      if (codes.length) onLectura(codes[0].rawValue, formatoNombre(codes[0].format));
    } catch (e) {}
    if (activo) setTimeout(tick, 150);
  };
  tick();
  return () => { activo = false; };
}

function detenerCamara() {
  if (parar) { try { parar(); } catch (e) {} }
  parar = null;
  if (video.srcObject) { video.srcObject.getTracks().forEach((t) => t.stop()); video.srcObject = null; }
  camActiva = false;
  btnCam.textContent = 'Iniciar cámara';
  estadoCam('Cámara detenida.');
}

function onLectura(texto, formato) {
  const ahora = Date.now();
  if (texto === lastCode && ahora - lastTime < 2500) return; // evita repetidos
  lastCode = texto; lastTime = ahora;
  codigoIn.value = texto;
  formatoIn.value = formato;
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
  estadoCam('Leído ' + formato + ': ' + texto, 'ok');
  cantIn.focus();
}

btnCam.addEventListener('click', () => { if (camActiva) detenerCamara(); else iniciarCamara(); });

// Leer desde una foto (funciona aunque la cámara en vivo no lea)
fotoIn.addEventListener('change', async () => {
  const file = fotoIn.files && fotoIn.files[0];
  fotoIn.value = '';
  if (!file) return;
  estadoCam('Leyendo la foto…');
  const url = URL.createObjectURL(file);
  try {
    if (typeof ZXing === 'undefined') throw new Error('sin lector');
    const r = await crearLector().decodeFromImageUrl(url);
    onLectura(r.getText(), formatoNombre(r.getBarcodeFormat()));
  } catch (e) {
    estadoCam('No se pudo leer la foto. Acércate más, que el código ocupe casi toda la imagen y que no tenga reflejos.', 'err');
  } finally {
    URL.revokeObjectURL(url);
  }
});

// Guardar: envía a Apps Script (POST, text/plain evita preflight)
async function guardar() {
  const codigo = codigoIn.value.trim();
  const cant = cantIn.value.trim();
  const usuario = usuarioIn.value.trim();
  if (!codigo) return mostrar('Escanea o escribe un código.', 'err');
  if (cant === '' || isNaN(Number(cant))) return mostrar(tipo === 'Medidor' ? 'Escribe la lectura.' : 'Escribe la cantidad.', 'err');
  if (!usuario) return mostrar('Escribe el usuario.', 'err');
  const token = getToken();
  if (!token) return mostrar('Falta el token.', 'err');

  const datos = {
    token: token,
    hoja: HOJA,
    fecha: new Date().toISOString(),
    tipo: tipo,
    codigo: codigo,
    formato: formatoIn.value || 'manual',
    cantidad: Number(cant),
    usuario: usuario,
    notas: notasIn.value.trim()
  };

  btnGuardar.disabled = true;
  mostrar('Guardando…');
  try {
    const r = await fetch(APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos)
    });
    const j = await r.json();
    if (j.ok) {
      escribir(USUARIO_KEY, usuario);
      codigoIn.value = ''; formatoIn.value = ''; cantIn.value = ''; notasIn.value = '';
      lastCode = '';
      mostrar('Guardado en la fila ' + j.fila + '.', 'ok');
    } else {
      if (j.error === 'token invalido') borrar(TOKEN_KEY);
      mostrar('Error: ' + (j.error || 'desconocido') + '. Los datos siguen en pantalla.', 'err');
    }
  } catch (e) {
    mostrar('No se pudo enviar. Revisa la conexión; los datos siguen en pantalla.', 'err');
  } finally {
    btnGuardar.disabled = false;
  }
}
btnGuardar.addEventListener('click', guardar);

$('btnToken').addEventListener('click', () => {
  borrar(TOKEN_KEY);
  mostrar('Token borrado. Se pedirá de nuevo al guardar.');
});
</script>
</body>
</html>
